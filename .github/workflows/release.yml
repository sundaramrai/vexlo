name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/vexlo-server-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/vexlo-server-linux-arm64 ./cmd/server
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/vexlo-linux-amd64 ./cmd/client
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/vexlo-linux-arm64 ./cmd/client
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/vexlo-darwin-amd64 ./cmd/client
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/vexlo-darwin-arm64 ./cmd/client
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/vexlo-windows-amd64.exe ./cmd/client
      - name: Package artifacts
        run: |
          cd dist
          tar -czf vexlo-server-linux-amd64.tar.gz vexlo-server-linux-amd64
          tar -czf vexlo-server-linux-arm64.tar.gz vexlo-server-linux-arm64
          tar -czf vexlo-linux-amd64.tar.gz vexlo-linux-amd64
          tar -czf vexlo-linux-arm64.tar.gz vexlo-linux-arm64
          tar -czf vexlo-darwin-amd64.tar.gz vexlo-darwin-amd64
          tar -czf vexlo-darwin-arm64.tar.gz vexlo-darwin-arm64
          zip -q vexlo-windows-amd64.zip vexlo-windows-amd64.exe
          rm -f \
            vexlo-server-linux-amd64 \
            vexlo-server-linux-arm64 \
            vexlo-linux-amd64 \
            vexlo-linux-arm64 \
            vexlo-darwin-amd64 \
            vexlo-darwin-arm64 \
            vexlo-windows-amd64.exe
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
