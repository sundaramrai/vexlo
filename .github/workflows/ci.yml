name: CI

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/ci.yml"
      - ".golangci.yml"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".golangci.yml"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "scripts/**"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test Unix installer with local release fixture
        run: sh scripts/test_install.sh

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal scripts)"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Check reachable dependency vulnerabilities
        # Pin this for reproducible scans with the Go 1.25 toolchain above.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Build
        run: go build ./...

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test Windows installer with local release fixture
        shell: pwsh
        run: ./scripts/test_install.ps1

  macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test macOS installer with local release fixture
        run: sh scripts/test_install.sh
