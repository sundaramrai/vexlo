<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vexlo</title>
  <link rel="stylesheet" href="/assets/dashboard.css" />
</head>

<body>
  <div class="shell">
    <header class="topbar">
      <div class="status-stack">
        <span class="title" id="tunnel-url">no active tunnel</span>
        <span class="chip">
          <span class="connection-dot" id="connection-dot"></span>
          <span id="connection-status">offline</span>
        </span>
      </div>
      <div class="topbar-meta">
        <span class="subtle" id="request-count">0 requests</span>
        <span class="subtle" id="session-duration">00:00:00</span>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="filter-group" id="method-filters" aria-label="Method filters">
          <button type="button" class="method-filter active" data-method="ALL">
            ALL
          </button>
          <button type="button" class="method-filter" data-method="GET">
            GET
          </button>
          <button type="button" class="method-filter" data-method="POST">
            POST
          </button>
          <button type="button" class="method-filter" data-method="PUT">
            PUT
          </button>
          <button type="button" class="method-filter" data-method="DELETE">
            DELETE
          </button>
        </div>

        <div class="search-wrap">
          <label class="sr-only" for="search">Search requests</label>
          <input id="search" type="search" placeholder="search method, path, body, or response" autocomplete="off" />
        </div>

        <div class="subtle" id="list-state">Loading requests...</div>

        <div class="request-list" id="request-list" aria-label="Captured requests"></div>
      </aside>

      <main class="main">
        <div class="banner" id="error-banner" role="alert"></div>

        <div class="toolbar">
          <div class="toolbar-title">
            <strong id="selected-title">Select a request</strong>
            <span class="detail-meta" id="selected-meta">Live traffic appears here as requests arrive.</span>
          </div>
          <div class="toolbar-actions">
            <button type="button" id="copy-curl" disabled>copy curl</button>
            <button type="button" id="replay" disabled>replay</button>
          </div>
        </div>

        <div class="tabs" role="tablist" aria-label="Request details tabs">
          <button type="button" class="tab-button active" data-tab="request" role="tab" aria-selected="true">
            REQUEST
          </button>
          <button type="button" class="tab-button" data-tab="response" role="tab" aria-selected="false">
            RESPONSE
          </button>
          <button type="button" class="tab-button" data-tab="mutate" role="tab" aria-selected="false">
            MUTATE
          </button>
        </div>

        <div class="detail-grid">
          <section class="panel" id="left-panel" aria-live="polite"></section>
          <section class="panel" id="right-panel"></section>
        </div>

        <footer class="footer">
          <div class="footer-row" id="replay-status">last replay none</div>
          <div class="footer-row subtle" id="footer-status"></div>
        </footer>
      </main>
    </div>
  </div>

  <script type="module" src="/assets/dashboard.js"></script>
</body>

</html>
